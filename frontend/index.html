<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhispFlow — WhatsApp B2B Outreach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Pre-hydration minimal CSS loader matching Tailwind dark mode support */
      #initial-loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: #ffffff; flex-direction: column; font-family: 'DM Sans', sans-serif; }
      @media (prefers-color-scheme: dark) { #initial-loader { background-color: #111827; } }
      .wf-spinner-track { width: 3rem; height: 3rem; border-radius: 50%; border: 3px solid #f3f4f6; position: relative; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; }
      @media (prefers-color-scheme: dark) { .wf-spinner-track { border-color: #1f2937; } }
      .wf-spinner-head { width: 3rem; height: 3rem; border-radius: 50%; border: 3px solid #22c55e; border-top-color: transparent; position: absolute; top: -3px; left: -3px; animation: spin 1s linear infinite; }
      .wf-spinner-core { width: 1rem; height: 1rem; background-color: rgba(34, 197, 94, 0.2); border-radius: 50%; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .wf-text { color: #6b7280; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
      @media (prefers-color-scheme: dark) { .wf-text { color: #9ca3af; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="wf-spinner-track">
          <div class="wf-spinner-head"></div>
          <div class="wf-spinner-core"></div>
        </div>
        <div class="wf-text">LOADING...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
